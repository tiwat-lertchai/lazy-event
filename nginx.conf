server {
    listen 80;

    # Backend API — keep the /api prefix intact, backend routes expect it
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded photo files, served directly by the backend
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # LINE webhook, mounted at root on the backend (no /api prefix)
    location /webhook {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Everything else goes to the Vite dev server, including its HMR websocket
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
