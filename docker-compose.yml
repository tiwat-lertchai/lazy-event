services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount source so --hot reload picks up local edits without rebuilding the image
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # Uploaded photos persist across container restarts, matches UPLOAD_DIR in .env
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  backend_node_modules:
  frontend_node_modules:
  uploads:
